name: Plugin quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Admin JavaScript syntax
        run: node --check admin/assets/js/admin.js
      - name: Required v2 files
        run: |
          test -f includes/class-hip-ad-schema.php
          test -f includes/class-hip-ad-repository.php
          test -f includes/class-hip-ad-migrator.php
          test -f admin/views/v2/dashboard.php
          test -f admin/views/v2/slot-edit.php
